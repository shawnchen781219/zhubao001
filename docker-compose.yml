services:
  postgres:
    image: postgres:16-alpine
    container_name: jewelry-postgres
    environment:
      POSTGRES_DB: jewelry_digital
      POSTGRES_USER: jewelry
      POSTGRES_PASSWORD: jewelry
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jewelry-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
