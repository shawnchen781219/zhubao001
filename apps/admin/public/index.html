<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>法芮珂珠宝 · 运营管理后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=309" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <svg class="sidebar-logo-svg" width="32" height="32" viewBox="0 0 64 64" fill="none"><title>icon</title>
            <path d="M32 4L44 20H56L40 36L46 52H38L32 60L26 52H18L24 36L8 20H20L32 4Z" fill="url(#sg1)" />
            <defs><linearGradient id="sg1" x1="8" y1="4" x2="56" y2="60"><stop stop-color="#E8D5A0"/><stop offset="1" stop-color="#8B6914"/></linearGradient></defs>
          </svg>
          <div class="sidebar-brand-text">
            <h1 class="brand-name">法芮珂珠宝</h1>
            <p class="brand-sub">FARICO · MANAGEMENT</p>
          </div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-view="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><title>icon</title><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>运营总览</span>
        </a>
        <a href="#" class="nav-item" data-view="customers">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><title>icon</title><circle cx="9" cy="7" r="4"/><path d="M3 21c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="8" r="3"/><path d="M15 21c0-2.8 2.2-5 5-5"/></svg>
          <span>客户管理</span>
        </a>
        <a href="#" class="nav-item" data-view="tryons">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><title>icon</title><path d="M12 2L15.5 9H22L17 14L19 21H12L5 21L7 14L2 9H8.5L12 2Z"/></svg>
          <span>试戴记录</span>
        </a>
        <a href="#" class="nav-item" data-view="devices">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><title>icon</title><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          <span>设备管理</span>
        </a>
        <a href="#" class="nav-item" data-view="coupons">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><title>icon</title><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M2 10h20"/><circle cx="7" cy="15" r="1" fill="currentColor"/><circle cx="10" cy="15" r="1" fill="currentColor"/></svg>
          <span>优惠券</span>
        </a>
        <a href="#" class="nav-item" data-view="members">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><title>icon</title><path d="M12 2L15.09 8.26 22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <span>会员管理</span>
          <span class="nav-badge-new">二期</span>
        </a>
        <a href="#" class="nav-item" data-view="activities">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><title>icon</title><path d="M12 2L15.5 9H22L17 14L19 21H12L5 21L7 14L2 9H8.5L12 2Z"/></svg>
          <span>活动配置</span>
          <span class="nav-badge-new">三期</span>
        </a>
        <a href="#" class="nav-item" data-view="tradeins">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><title>icon</title><path d="M3 12a9 9 0 0118 0M12 3v9m0 0l6 6m-6-6L6 18"/></svg>
          <span>以旧焕新</span>
          <span class="nav-badge-new">三期</span>
        </a>
        <a href="#" class="nav-item" data-view="care">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><title>icon</title><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span>保养日历</span>
          <span class="nav-badge-new">二期</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar">张</div>
          <div class="user-info">
            <span class="user-name">张明华</span>
            <span class="user-role">门店经理</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-title" id="page-title">运营总览</h1>
          <p class="page-subtitle" id="page-subtitle">今日门店运营数据实时概览</p>
        </div>
        <div class="topbar-right">
          <span class="api-status" id="api-status">
            <span class="status-dot"></span>
            <span class="status-text">API 已连接</span>
          </span>
        </div>
      </header>

      <!-- Content Area -->
      <div class="content" id="content">
        <!-- Dashboard View -->
        <div class="view active" id="view-dashboard">
          <div class="metrics-grid" id="metrics-grid"></div>

          <div class="dashboard-grid dash-3col">
            <div class="panel panel-funnel">
              <div class="panel-header"><h2 class="panel-title">转化漏斗</h2></div>
              <div class="panel-body" id="funnel-content"></div>
            </div>
            <div class="panel panel-chart">
              <div class="panel-header"><h2 class="panel-title">周试戴趋势</h2><span class="panel-hint">本周</span></div>
              <div class="panel-body weekly-chart" id="weekly-chart"></div>
            </div>
            <div class="panel panel-pie">
              <div class="panel-header"><h2 class="panel-title">会员等级分布</h2></div>
              <div class="panel-body tier-wrap" id="tier-chart"></div>
            </div>
          </div>

          <div class="dashboard-grid">
            <div class="panel">
              <div class="panel-header">
                <h2 class="panel-title">今日试戴</h2>
                <button type="button" class="btn btn-sm btn-ghost" onclick="switchView('tryons')">查看全部 →</button>
              </div>
              <div class="panel-body" id="dashboard-tryons"></div>
            </div>
            <div class="panel">
              <div class="panel-header">
                <h2 class="panel-title">快捷入口</h2>
              </div>
              <div class="panel-body quick-links" id="quick-links"></div>
            </div>
            <div class="panel">
              <div class="panel-header">
                <h2 class="panel-title">活跃客户</h2>
                <button type="button" class="btn btn-sm btn-ghost" onclick="switchView('customers')">查看全部 →</button>
              </div>
              <div class="panel-body" id="dashboard-customers"></div>
            </div>
          </div>
        </div>

        <!-- Customers View -->
        <div class="view" id="view-customers">
          <div class="toolbar">
            <div class="search-wrap">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><title>icon</title><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              <input type="search" class="search-input" placeholder="搜索客户姓名、手机号..." id="customer-search" />
            </div>
            <div class="filter-group" id="customer-filters"></div>
          </div>
          <div class="data-table">
            <table>
              <thead>
                <tr>
                  <th>客户</th>
                  <th>来源</th>
                  <th>试戴次数</th>
                  <th>优惠券</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="customers-tbody"></tbody>
            </table>
          </div>
        </div>

        <!-- Tryons View -->
        <div class="view" id="view-tryons">
          <div class="toolbar">
            <div class="filter-group" id="tryon-filters"></div>
          </div>
          <div class="cards-grid" id="tryons-grid"></div>
        </div>

        <!-- Devices View -->
        <div class="view" id="view-devices">
          <div class="cards-grid" id="devices-grid"></div>
        </div>

        <!-- Coupons View -->
        <div class="view" id="view-coupons">
          <div class="toolbar">
            <div class="filter-group" id="coupon-filters"></div>
          </div>
          <div class="data-table">
            <table>
              <thead>
                <tr>
                  <th>券码</th>
                  <th>类型</th>
                  <th>客户</th>
                  <th>领取时间</th>
                  <th>有效期</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="coupons-tbody"></tbody>
            </table>
          </div>
        </div>

        <!-- Members View (Phase 2) -->
        <div class="view" id="view-members">
          <div class="stats-row" id="mem-stats"></div>
          <div class="toolbar">
            <div class="filter-group" id="mem-filters"></div>
          </div>
          <div class="data-table">
            <table>
              <thead>
                <tr>
                  <th>会员</th>
                  <th>等级</th>
                  <th>积分</th>
                  <th>累计消费</th>
                  <th>徽章</th>
                  <th>最近活跃</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="mem-tbody"></tbody>
            </table>
          </div>
        </div>

        <!-- Activities View (Phase 3) -->
        <div class="view" id="view-activities">
          <div class="stats-row" id="act-stats"></div>
          <div class="cards-grid cards-grid-3" id="act-grid"></div>
          <div class="panel" id="ref-panel" style="margin-top:20px;"></div>
          <div class="panel" id="blindbox-panel" style="margin-top:20px;"></div>
        </div>

        <!-- Trade-ins View (Phase 3) -->
        <div class="view" id="view-tradeins">
          <div class="stats-row" id="ti-stats"></div>
          <div class="data-table">
            <table>
              <thead>
                <tr>
                  <th>客户</th>
                  <th>回收物品</th>
                  <th>估价</th>
                  <th>换购价值</th>
                  <th>状态</th>
                  <th>提交日期</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="ti-tbody"></tbody>
            </table>
          </div>
        </div>

        <!-- Care View (Phase 2) -->
        <div class="view" id="view-care">
          <div class="stats-row" id="care-stats"></div>
          <div class="data-table">
            <table>
              <thead>
                <tr>
                  <th>物品</th>
                  <th>客户</th>
                  <th>保养类型</th>
                  <th>预约日期</th>
                  <th>状态</th>
                  <th>备注</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="care-tbody"></tbody>
            </table>
          </div>
        </div>

      </div>
    </main>

    <!-- Detail Drawer -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
    <aside class="drawer" id="drawer">
      <div class="drawer-header">
        <h2 id="drawer-title">详情</h2>
        <button type="button" class="drawer-close" onclick="closeDrawer()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><title>icon</title><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="app.js?v=309"></script>
</body>
</html>
